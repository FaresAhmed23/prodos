# Mosquitto configuration for the single-host pilot (docker-compose.prod.yml).
#
# Separate from ../mosquitto.conf (the dev file) on purpose. Two things here are
# pilot-specific and would be wrong to leak into local development:
#
#   1. Persistence. PRO-16 is moving prodos/events to QoS 1 so a DetectionEvent
#      is retried until it is acknowledged. QoS 1 redelivery across a broker
#      restart depends entirely on persisted sessions -- without this block a
#      power blip silently drops any alert that was in flight, which is the one
#      failure mode a security pilot cannot have.
#   2. Queue bounds. ~200 frames/sec/sensor. Frames are deliberately QoS 0
#      best-effort, but nothing stops a stalled consumer from otherwise filling
#      the disk on a Pi with an SD card.

listener 1883

# Anonymous access. The ESP32 sensors have no credential storage in firmware
# yet, so a password is not currently enforceable on the sensor side. This is a
# known pilot tradeoff, not a recommendation: it trusts the local network. Add
# a password_file and firmware support before exposing this host to anything
# untrusted or to the public internet.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Autosave every 5 minutes rather than on every write. On an SD card the
# default (saving on change) wears the card out; every 5 min still bounds
# redelivery loss to a 5-minute window.
autosave_interval 300

# Cap what a slow consumer can accumulate.
max_queued_messages 10000
# Frames arrive at QoS 0 and are worthless once stale -- a queued beacon from
# last minute is not evidence of anything. Dropping them is correct.
queue_qos0_messages false

# Log to stdout so `docker compose logs mosquitto` works. Writing into the
# mounted log volume instead would fill the SD card and go unread.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
log_type unsubscribe
connection_messages true
