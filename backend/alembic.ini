[alembic]
script_location = migrations

# So `alembic` can `import app` regardless of the shell's working directory.
prepend_sys_path = .

# Alembic 1.20 deprecates guessing how to split a path list. Windows paths
# contain colons, which is exactly the ambiguity this removes.
path_separator = os

# sqlalchemy.url is deliberately empty. migrations/env.py takes the URL from
# app.config.settings instead, so there is exactly one source of truth for the
# database URL. A value here would silently shadow .env and point a migration at
# the wrong database, which is the worst possible failure for a migration.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
