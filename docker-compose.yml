services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prodos
      POSTGRES_PASSWORD: prodos
      POSTGRES_DB: prodos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodos"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://prodos:prodos@db:5432/prodos
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mosquitto

volumes:
  pgdata: